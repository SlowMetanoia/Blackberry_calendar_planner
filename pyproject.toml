[project]
name = "smart-planner"
version = "0.1.0"
description = "Asynchronous voice-controlled planner backend"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "arq>=0.26,<1",
  "asyncpg>=0.29,<1",
  "bcrypt>=4.1,<5",
  "fastapi>=0.115,<1",
  "email-validator>=2.2,<3",
  "httpx>=0.27,<1",
  "langgraph>=0.6,<1",
  "pgvector>=0.3,<1",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "pyyaml>=6,<7",
  "redis>=5,<6",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "aiosqlite>=0.20",
  "ruff>=0.9,<1",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# FastAPI intentionally declares dependency factories in endpoint defaults.
ignore = ["B008"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
